<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BorsaScreen - FTSE MIB 40 Screener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' } } } }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        input[type=range] { accent-color: #0ea5e9; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-900/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <button onclick="window.location.reload()" class="flex items-center gap-2.5 group">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-sky-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-sky-500/20">
                        <i data-lucide="trending-up" class="w-4 h-4 text-white"></i>
                    </div>
                    <div class="text-left">
                        <span class="text-sm font-bold text-white block leading-tight">BorsaScreen</span>
                        <span class="text-[10px] text-slate-500 leading-tight">FTSE MIB 40 Analysis</span>
                    </div>
                </button>
                <div class="flex items-center gap-3">
                    <div id="data-status" class="hidden sm:flex items-center gap-1.5 text-xs text-slate-500">
                        <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Loading...
                    </div>
                    <button onclick="loadScreener()" id="refresh-btn" class="p-2 text-slate-400 hover:text-sky-400 hover:bg-slate-800 rounded-lg transition-all">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full space-y-6">
        
        <!-- Controls Bar -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-white">Stock Screener</h1>
                <p id="result-count" class="text-sm text-slate-400 mt-0.5">Loading...</p>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                    <input type="text" id="search-input" oninput="applyFilters()" placeholder="Search ticker..." 
                        class="pl-9 pr-3 py-2 bg-slate-800/50 border border-slate-700/50 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500/50 w-40 sm:w-48">
                </div>
                <select id="sort-select" onchange="applyFilters()" class="bg-slate-800/50 border border-slate-700/50 rounded-lg text-sm text-white px-3 py-2 focus:outline-none focus:border-sky-500/50">
                    <option value="roe_desc">Best ROE (Highest)</option>
                    <option value="pe_asc">Best P/E (Lowest)</option>
                    <option value="rsi_asc">Lowest RSI (Oversold)</option>
                    <option value="upside_desc">Highest Upside</option>
                    <option value="ticker_asc">Ticker (A-Z)</option>
                </select>
                <div class="flex bg-slate-800/50 border border-slate-700/50 rounded-lg overflow-hidden">
                    <button onclick="setView('grid')" id="btn-grid" class="px-3 py-2 text-sm transition-colors bg-sky-500/20 text-sky-400">
                        <i data-lucide="grid-3x3" class="w-4 h-4"></i>
                    </button>
                    <button onclick="setView('table')" id="btn-table" class="px-3 py-2 text-sm transition-colors text-slate-400 hover:text-white">
                        <i data-lucide="table" class="w-4 h-4"></i>
                    </button>
                </div>
                <button onclick="toggleFilters()" class="relative inline-flex items-center gap-2 px-3 py-2 bg-slate-800/50 border border-slate-700/50 rounded-lg text-sm text-white hover:border-sky-500/50 transition-colors">
                    <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Filters</span>
                    <span id="filter-badge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-sky-500 rounded-full text-[10px] text-white flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>

        <!-- Filters Panel -->
        <div id="filter-panel" class="hidden rounded-xl border border-slate-700/50 bg-slate-800/20 p-5 space-y-5">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold text-white">Fundamental & Technical Filters</h2>
                <button onclick="resetFilters()" class="inline-flex items-center gap-1 text-xs text-slate-400 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-3 h-3"></i> Clear all
                </button>
            </div>
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-500">Max P/E Ratio</label>
                        <span id="val-pe" class="text-xs font-mono font-semibold text-sky-400">Any</span>
                    </div>
                    <input type="range" id="filter-pe" min="0" max="100" step="1" value="100" oninput="updateSlider('pe', 100); applyFilters()" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-500">Min ROE (%)</label>
                        <span id="val-roe" class="text-xs font-mono font-semibold text-sky-400">Any</span>
                    </div>
                    <input type="range" id="filter-roe" min="0" max="30" step="1" value="0" oninput="updateSlider('roe', 0); applyFilters()" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-500">Max RSI (14)</label>
                        <span id="val-rsi" class="text-xs font-mono font-semibold text-sky-400">Any</span>
                    </div>
                    <input type="range" id="filter-rsi" min="10" max="90" step="1" value="90" oninput="updateSlider('rsi', 90); applyFilters()" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Results Area -->
        <div id="results-area" class="space-y-4"></div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-center">
            <p class="text-xs text-slate-500">BorsaScreen · FTSE MIB 40 Analysis · For educational purposes only. Not financial advice.</p>
        </div>
    </footer>

    <!-- Chart Modal -->
    <div id="chart-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-4xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span id="chart-ticker" class="text-sky-400"></span> Historical Price
                </h2>
                <button onclick="closeChart()" class="p-1 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="chart-container" class="w-full h-96 bg-slate-950 rounded-lg border border-slate-800"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // CRITICAL: REPLACE THIS WITH YOUR ACTUAL WORKER URL
        const WORKER_URL = 'https://YOUR_WORKER_URL_HERE.workers.dev'; 
        
        let allStocks = [];
        let filteredStocks = [];
        let currentView = 'grid';
        let currentChart = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadScreener();
        });

        async function loadScreener() {
            const statusEl = document.getElementById('data-status');
            const refreshBtn = document.getElementById('refresh-btn');
            const resultsArea = document.getElementById('results-area');
            
            statusEl.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Loading...';
            statusEl.className = 'hidden sm:flex items-center gap-1.5 text-xs text-sky-400';
            refreshBtn.classList.add('animate-spin');
            lucide.createIcons();

            try {
                const res = await fetch(`${WORKER_URL}/api/screener`);
                if (!res.ok) throw new Error(`Server Error: ${res.status}`);
                allStocks = await res.json();
                
                statusEl.innerHTML = '<i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Live data';
                statusEl.className = 'hidden sm:flex items-center gap-1.5 text-xs text-emerald-400';
                applyFilters();
            } catch (error) {
                statusEl.innerHTML = '<i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> Error';
                statusEl.className = 'hidden sm:flex items-center gap-1.5 text-xs text-red-400';
                resultsArea.innerHTML = `<div class="rounded-xl border border-red-500/20 bg-red-500/5 p-12 text-center"><h3 class="text-red-400 font-bold mb-2">Failed to Load Data</h3><p class="text-red-300 text-sm mb-4">${error.message}</p></div>`;
            } finally {
                refreshBtn.classList.remove('animate-spin');
                lucide.createIcons();
            }
        }

        function updateSlider(id, maxVal) {
            const val = document.getElementById(`filter-${id}`).value;
            document.getElementById(`val-${id}`).textContent = val == maxVal ? 'Any' : val;
        }

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const maxPe = parseFloat(document.getElementById('filter-pe').value);
            const minRoe = parseFloat(document.getElementById('filter-roe').value);
            const maxRsi = parseFloat(document.getElementById('filter-rsi').value);
            const sortBy = document.getElementById('sort-select').value;

            filteredStocks = allStocks.filter(s => {
                const matchSearch = s.ticker.toLowerCase().includes(search);
                const matchPe = s.pe <= maxPe;
                const matchRoe = s.roe >= minRoe;
                const matchRsi = s.rsi <= maxRsi;
                return matchSearch && matchPe && matchRoe && matchRsi;
            });

            filteredStocks.sort((a, b) => {
                if (sortBy === 'roe_desc') return b.roe - a.roe;
                if (sortBy === 'pe_asc') return a.pe - b.pe;
                if (sortBy === 'rsi_asc') return a.rsi - b.rsi;
                if (sortBy === 'ticker_asc') return a.ticker.localeCompare(b.ticker);
                if (sortBy === 'upside_desc') {
                    const upA = a.target_mean ? ((a.target_mean - a.price) / a.price) : -1;
                    const upB = b.target_mean ? ((b.target_mean - b.price) / b.price) : -1;
                    return upB - upA;
                }
                return 0;
            });

            updateFilterBadge(maxPe, minRoe, maxRsi);
            renderResults();
        }

        function updateFilterBadge(maxPe, minRoe, maxRsi) {
            let count = 0;
            if (maxPe < 100) count++;
            if (minRoe > 0) count++;
            if (maxRsi < 90) count++;
            const badge = document.getElementById('filter-badge');
            if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); } 
            else { badge.classList.add('hidden'); }
        }

        function resetFilters() {
            document.getElementById('filter-pe').value = 100; updateSlider('pe', 100);
            document.getElementById('filter-roe').value = 0; updateSlider('roe', 0);
            document.getElementById('filter-rsi').value = 90; updateSlider('rsi', 90);
            document.getElementById('search-input').value = '';
            applyFilters();
        }

        function toggleFilters() { document.getElementById('filter-panel').classList.toggle('hidden'); }

        function setView(view) {
            currentView = view;
            document.getElementById('btn-grid').className = view === 'grid' ? 'px-3 py-2 text-sm transition-colors bg-sky-500/20 text-sky-400' : 'px-3 py-2 text-sm transition-colors text-slate-400 hover:text-white';
            document.getElementById('btn-table').className = view === 'table' ? 'px-3 py-2 text-sm transition-colors bg-sky-500/20 text-sky-400' : 'px-3 py-2 text-sm transition-colors text-slate-400 hover:text-white';
            renderResults();
        }

        function renderResults() {
            const container = document.getElementById('results-area');
            document.getElementById('result-count').textContent = `${filteredStocks.length} of ${allStocks.length} stocks match your criteria`;

            if (filteredStocks.length === 0) {
                container.innerHTML = `<div class="rounded-xl border border-slate-700/50 bg-slate-800/20 p-12 text-center"><p class="text-slate-400">No stocks match your filters.</p><button onclick="resetFilters()" class="mt-3 text-sky-400 hover:text-sky-300 text-sm font-medium">Reset filters</button></div>`;
                return;
            }

            if (currentView === 'grid') {
                container.innerHTML = `<div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">${filteredStocks.map(renderCard).join('')}</div>`;
            } else {
                container.innerHTML = `<div class="rounded-xl border border-slate-700/50 bg-slate-800/20 overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-700/50"><th class="p-3">Ticker</th><th class="p-3 text-right">Price</th><th class="p-3 text-right">P/E</th><th class="p-3 text-right">ROE</th><th class="p-3 text-right">RSI</th><th class="p-3 text-right hidden sm:table-cell">Target</th><th class="p-3 text-right hidden sm:table-cell">Upside</th><th class="p-3 text-center">Analyst</th><th class="p-3 text-center">Action</th></tr></thead><tbody class="divide-y divide-slate-700/20">${filteredStocks.map(renderTableRow).join('')}</tbody></table></div>`;
            }
            lucide.createIcons();
        }

        function renderCard(s) {
            const upside = s.target_mean ? (((s.target_mean - s.price) / s.price) * 100).toFixed(1) : null;
            const upsideColor = upside !== null && upside > 0 ? 'text-emerald-400' : (upside !== null ? 'text-red-400' : 'text-slate-500');
            const rsiColor = s.rsi < 30 ? 'text-emerald-400' : (s.rsi > 70 ? 'text-red-400' : 'text-slate-300');
            const recColor = s.analyst_rec?.toLowerCase().includes('buy') ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 
                             s.analyst_rec?.toLowerCase().includes('sell') ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-slate-700/30 text-slate-400 border-slate-700/50';
            return `<div class="group rounded-xl border border-slate-700/50 bg-slate-800/20 p-4 hover:border-sky-500/30 hover:bg-slate-800/40 transition-all cursor-pointer" onclick="openChart('${s.ticker}')">
                <div class="flex justify-between items-start mb-3">
                    <div><h3 class="font-bold text-white text-lg">${s.ticker.replace('.MI', '')}</h3><p class="text-xs text-slate-500">FTSE MIB</p></div>
                    <span class="px-2 py-1 text-[10px] font-bold rounded-full border ${recColor}">${s.analyst_rec ? s.analyst_rec.toUpperCase() : 'N/A'}</span>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div><p class="text-[10px] text-slate-500 uppercase tracking-wider">Price</p><p class="font-mono text-white font-semibold">€${s.price.toFixed(2)}</p></div>
                    <div><p class="text-[10px] text-slate-500 uppercase tracking-wider">P/E</p><p class="font-mono text-slate-300">${s.pe >= 999 ? 'N/A' : s.pe.toFixed(1)}</p></div>
                    <div><p class="text-[10px] text-slate-500 uppercase tracking-wider">ROE</p><p class="font-mono text-slate-300">${s.roe.toFixed(1)}%</p></div>
                    <div><p class="text-[10px] text-slate-500 uppercase tracking-wider">RSI (14)</p><p class="font-mono font-semibold ${rsiColor}">${s.rsi.toFixed(1)}</p></div>
                </div>
                <div class="flex items-center justify-between pt-3 border-t border-slate-700/30">
                    <div><p class="text-[10px] text-slate-500 uppercase tracking-wider">Upside to Target</p><p class="font-mono font-semibold ${upsideColor}">${upside !== null ? (upside > 0 ? '+' : '') + upside + '%' : 'N/A'}</p></div>
                    <button class="px-3 py-1.5 bg-sky-500/10 text-sky-400 text-xs font-medium rounded-lg hover:bg-sky-500/20 transition-colors flex items-center gap-1"><i data-lucide="bar-chart-3" class="w-3 h-3"></i> Chart</button>
                </div></div>`;
        }

        function renderTableRow(s) {
            const upside = s.target_mean ? (((s.target_mean - s.price) / s.price) * 100).toFixed(1) : null;
            const upsideColor = upside !== null && upside > 0 ? 'text-emerald-400' : (upside !== null ? 'text-red-400' : 'text-slate-500');
            const rsiColor = s.rsi < 30 ? 'text-emerald-400' : (s.rsi > 70 ? 'text-red-400' : 'text-slate-300');
            const recColor = s.analyst_rec?.toLowerCase().includes('buy') ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 
                             s.analyst_rec?.toLowerCase().includes('sell') ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-slate-700/30 text-slate-400 border-slate-700/50';
            return `<tr class="hover:bg-slate-700/20 transition-colors cursor-pointer" onclick="openChart('${s.ticker}')">
                <td class="p-3"><div class="font-bold text-white">${s.ticker.replace('.MI', '')}</div></td>
                <td class="p-3 text-right font-mono text-white">€${s.price.toFixed(2)}</td>
                <td class="p-3 text-right font-mono text-slate-300">${s.pe >= 999 ? 'N/A' : s.pe.toFixed(1)}</td>
                <td class="p-3 text-right font-mono text-slate-300">${s.roe.toFixed(1)}%</td>
                <td class="p-3 text-right font-mono font-semibold ${rsiColor}">${s.rsi.toFixed(1)}</td>
                <td class="p-3 text-right font-mono text-slate-300 hidden sm:table-cell">${s.target_mean ? '€' + s.target_mean.toFixed(2) : 'N/A'}</td>
                <td class="p-3 text-right font-mono font-semibold ${upsideColor} hidden sm:table-cell">${upside !== null ? (upside > 0 ? '+' : '') + upside + '%' : 'N/A'}</td>
                <td class="p-3 text-center"><span class="px-2 py-0.5 text-[10px] font-bold rounded-full border ${recColor}">${s.analyst_rec ? s.analyst_rec.toUpperCase() : 'N/A'}</span></td>
                <td class="p-3 text-center"><button class="p-1.5 text-slate-400 hover:text-sky-400 hover:bg-sky-500/10 rounded-lg transition-colors"><i data-lucide="bar-chart-3" class="w-4 h-4"></i></button></td>
            </tr>`;
        }

        async function openChart(ticker) {
            document.getElementById('chart-modal').classList.remove('hidden');
            document.getElementById('chart-ticker').textContent = ticker.replace('.MI', '');
            const container = document.getElementById('chart-container');
            container.innerHTML = ''; 
            
            try {
                const res = await fetch(`${WORKER_URL}/api/chart/${ticker}`);
                if (!res.ok) throw new Error('Failed to fetch chart data');
                const data = await res.json();

                // CRITICAL FIX: Lightweight Charts cannot render in a 'display: none' container.
                // If clientWidth is 0, we force a default width of 800px.
                const width = container.clientWidth > 0 ? container.clientWidth : 800;

                currentChart = LightweightCharts.createChart(container, {
                    width: width, 
                    height: 400,
                    layout: { background: { type: 'solid', color: '#020617' }, textColor: '#94a3b8' },
                    grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
                    timeScale: { timeVisible: false, borderColor: '#334155' },
                    rightPriceScale: { borderColor: '#334155' },
                });
                
                const areaSeries = currentChart.addAreaSeries({ topColor: 'rgba(14, 165, 233, 0.4)', bottomColor: 'rgba(14, 165, 233, 0.0)', lineColor: '#0ea5e9', lineWidth: 2, priceLineVisible: false });
                areaSeries.setData(data.map(d => ({ time: d.date, value: d.close })));
                currentChart.timeScale().fitContent();
            } catch (error) { 
                console.error("Chart Error:", error);
                container.innerHTML = '<p class="p-10 text-center text-red-400">Error loading chart data.</p>'; 
            }
        }

        function closeChart() {
            document.getElementById('chart-modal').classList.add('hidden');
            if (currentChart) { currentChart.remove(); currentChart = null; }
        }
    </script>
</body>
</html>
