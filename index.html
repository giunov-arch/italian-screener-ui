<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BorsaScreen - Italian Equity Screener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        input[type=range] { accent-color: #0ea5e9; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-900/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <button onclick="window.location.reload()" class="flex items-center gap-2.5 group">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-sky-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-sky-500/20">
                        <i data-lucide="trending-up" class="w-4 h-4 text-white"></i>
                    </div>
                    <div class="text-left">
                        <span class="text-sm font-bold text-white block leading-tight">BorsaScreen</span>
                        <span class="text-[10px] text-slate-500 leading-tight">Italian Stock Analysis</span>
                    </div>
                </button>

                <!-- Data Status & Refresh -->
                <div class="flex items-center gap-3">
                    <div id="data-status" class="hidden sm:flex items-center gap-1.5 text-xs text-slate-500">
                        <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Loading data...
                    </div>
                    <button onclick="loadScreener()" id="refresh-btn" class="p-2 text-slate-400 hover:text-sky-400 hover:bg-slate-800 rounded-lg transition-all" title="Refresh data">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full space-y-6">
        
        <!-- Controls Bar -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-white">Stock Screener</h1>
                <p id="result-count" class="text-sm text-slate-400 mt-0.5">Loading...</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Search -->
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                    <input type="text" id="search-input" oninput="applyFilters()" placeholder="Search ticker..." 
                        class="pl-9 pr-3 py-2 bg-slate-800/50 border border-slate-700/50 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500/50 w-40 sm:w-48 transition-colors">
                </div>
                <!-- View Toggle -->
                <div class="flex bg-slate-800/50 border border-slate-700/50 rounded-lg overflow-hidden">
                    <button onclick="setView('grid')" id="btn-grid" class="px-3 py-2 text-sm transition-colors bg-sky-500/20 text-sky-400">
                        <i data-lucide="grid-3x3" class="w-4 h-4"></i>
                    </button>
                    <button onclick="setView('table')" id="btn-table" class="px-3 py-2 text-sm transition-colors text-slate-400 hover:text-white">
                        <i data-lucide="table" class="w-4 h-4"></i>
                    </button>
                </div>
                <!-- Filter Toggle -->
                <button onclick="toggleFilters()" class="relative inline-flex items-center gap-2 px-3 py-2 bg-slate-800/50 border border-slate-700/50 rounded-lg text-sm text-white hover:border-sky-500/50 transition-colors">
                    <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Filters</span>
                    <span id="filter-badge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-sky-500 rounded-full text-[10px] text-white flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>

        <!-- Filters Panel -->
        <div id="filter-panel" class="hidden rounded-xl border border-slate-700/50 bg-slate-800/20 p-5 space-y-5">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold text-white">Fundamental & Technical Filters</h2>
                <button onclick="resetFilters()" class="inline-flex items-center gap-1 text-xs text-slate-400 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-3 h-3"></i> Clear all
                </button>
            </div>
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <FilterSlider id="filter-pe" label="Max P/E Ratio" min="0" max="30" step="1" value="30" display="Any" />
                <FilterSlider id="filter-roe" label="Min ROE (%)" min="0" max="30" step="1" value="0" display="Any" />
                <FilterSlider id="filter-rsi" label="Max RSI (14)" min="10" max="70" step="1" value="70" display="Any" />
            </div>
        </div>

        <!-- Results Area -->
        <div id="results-area" class="space-y-4">
            <!-- Content injected by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-center">
            <p class="text-xs text-slate-500">BorsaScreen · Italian Stock Exchange Analysis Tool · For educational purposes only. Not financial advice.</p>
        </div.
    </footer>

    <!-- Chart Modal -->
    <div id="chart-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-4xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 id="chart-title" class="text-lg font-bold text-white flex items-center gap-2">
                    <span id="chart-ticker" class="text-sky-400"></span> Historical Price
                </h2>
                <button onclick="closeChart()" class="p-1 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="chart-container" class="w-full h-96 bg-slate-950 rounded-lg border border-slate-800"></div>
            <p class="text-xs text-slate-500 mt-3 flex items-center gap-1">
                <i data-lucide="info" class="w-3 h-3"></i> Historical closing prices. The 200-day SMA and RSI are calculated in the backend data pipeline.
            </p>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const WORKER_URL = 'https://proud-boat-0a2f.giunov.workers.dev'; // REPLACE THIS
        
        let allStocks = [];
        let filteredStocks = [];
        let currentView = 'grid';
        let currentChart = null;

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadScreener();
        });

        // --- DATA FETCHING ---
        async function loadScreener() {
            const statusEl = document.getElementById('data-status');
            const refreshBtn = document.getElementById('refresh-btn');
            
            statusEl.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Loading...';
            statusEl.className = 'hidden sm:flex items-center gap-1.5 text-xs text-sky-400';
            refreshBtn.classList.add('animate-spin');
            lucide.createIcons();

            try {
                const res = await fetch(`${WORKER_URL}/api/screener`);
                if (!res.ok) throw new Error('Failed to fetch');
                allStocks = await res.json();
                
                statusEl.innerHTML = '<i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Live data';
                statusEl.className = 'hidden sm:flex items-center gap-1.5 text-xs text-emerald-400';
                
                applyFilters();
            } catch (error) {
                statusEl.innerHTML = '<i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> Error';
                statusEl.className = 'hidden sm:flex items-center gap-1.5 text-xs text-red-400';
                document.getElementById('results-area').innerHTML = `
                    <div class="rounded-xl border border-red-500/20 bg-red-500/5 p-12 text-center">
                        <p class="text-red-400">Error loading data. Please check your Worker URL configuration.</p>
                    </div>`;
            } finally {
                refreshBtn.classList.remove('animate-spin');
                lucide.createIcons();
            }
        }

        // --- FILTERING & RENDERING ---
        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const maxPe = parseFloat(document.getElementById('filter-pe').value);
            const minRoe = parseFloat(document.getElementById('filter-roe').value);
            const maxRsi = parseFloat(document.getElementById('filter-rsi').value);

            filteredStocks = allStocks.filter(s => {
                const matchSearch = s.ticker.toLowerCase().includes(search);
                const matchPe = s.pe <= maxPe;
                const matchRoe = s.roe >= minRoe;
                const matchRsi = s.rsi <= maxRsi;
                return matchSearch && matchPe && matchRoe && matchRsi;
            });

            updateFilterBadge();
            renderResults();
        }

        function updateFilterBadge() {
            const maxPe = parseFloat(document.getElementById('filter-pe').value);
            const minRoe = parseFloat(document.getElementById('filter-roe').value);
            const maxRsi = parseFloat(document.getElementById('filter-rsi').value);
            
            let count = 0;
            if (maxPe < 30) count++;
            if (minRoe > 0) count++;
            if (maxRsi < 70) count++;
            
            const badge = document.getElementById('filter-badge');
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function resetFilters() {
            document.getElementById('filter-pe').value = 30;
            document.getElementById('filter-pe').nextElementSibling.textContent = 'Any';
            document.getElementById('filter-roe').value = 0;
            document.getElementById('filter-roe').nextElementSibling.textContent = 'Any';
            document.getElementById('filter-rsi').value = 70;
            document.getElementById('filter-rsi').nextElementSibling.textContent = 'Any';
            document.getElementById('search-input').value = '';
            applyFilters();
        }

        function toggleFilters() {
            document.getElementById('filter-panel').classList.toggle('hidden');
        }

        function setView(view) {
            currentView = view;
            document.getElementById('btn-grid').className = view === 'grid' ? 'px-3 py-2 text-sm transition-colors bg-sky-500/20 text-sky-400' : 'px-3 py-2 text-sm transition-colors text-slate-400 hover:text-white';
            document.getElementById('btn-table').className = view === 'table' ? 'px-3 py-2 text-sm transition-colors bg-sky-500/20 text-sky-400' : 'px-3 py-2 text-sm transition-colors text-slate-400 hover:text-white';
            renderResults();
        }

        function renderResults() {
            const container = document.getElementById('results-area');
            document.getElementById('result-count').textContent = `${filteredStocks.length} of ${allStocks.length} stocks match your criteria`;

            if (filteredStocks.length === 0) {
                container.innerHTML = `
                    <div class="rounded-xl border border-slate-700/50 bg-slate-800/20 p-12 text-center">
                        <p class="text-slate-400">No stocks match your filters. Try loosening your criteria.</p>
                        <button onclick="resetFilters()" class="mt-3 text-sky-400 hover:text-sky-300 text-sm font-medium">Reset filters</button>
                    </div>`;
                return;
            }

            if (currentView === 'grid') {
                container.innerHTML = `<div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">${filteredStocks.map(renderCard).join('')}</div>`;
            } else {
                container.innerHTML = `
                    <div class="rounded-xl border border-slate-700/50 bg-slate-800/20 overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-left text-xs text-slate-500 border-b border-slate-700/50">
                                    <th class="p-3">Ticker</th>
                                    <th class="p-3 text-right">Price</th>
                                    <th class="p-3 text-right">P/E</th>
                                    <th class="p-3 text-right">ROE</th>
                                    <th class="p-3 text-right">RSI</th>
                                    <th class="p-3 text-right hidden sm:table-cell">Target</th>
                                    <th class="p-3 text-right hidden sm:table-cell">Upside</th>
                                    <th class="p-3 text-center">Analyst</th>
                                    <th class="p-3 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700/20">
                                ${filteredStocks.map(renderTableRow).join('')}
                            </tbody>
                        </table>
                    </div>`;
            }
            lucide.createIcons();
        }

        function renderCard(s) {
            const upside = s.target_mean ? (((s.target_mean - s.price) / s.price) * 100).toFixed(1) : null;
            const upsideColor = upside !== null && upside > 0 ? 'text-emerald-400' : (upside !== null ? 'text-red-400' : 'text-slate-500');
            const rsiColor = s.rsi < 30 ? 'text-emerald-400' : (s.rsi > 70 ? 'text-red-400' : 'text-slate-300');
            const recColor = s.analyst_rec?.toLowerCase().includes('buy') ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 
                             s.analyst_rec?.toLowerCase().includes('sell') ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-slate-700/30 text-slate-400 border-slate-700/50';

            return `
                <div class="group rounded-xl border border-slate-700/50 bg-slate-800/20 p-4 hover:border-sky-500/30 hover:bg-slate-800/40 transition-all cursor-pointer" onclick="openChart('${s.ticker}')">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold text-white text-lg">${s.ticker.replace('.MI', '')}</h3>
                            <p class="text-xs text-slate-500">FTSE MIB / STAR</p>
                        </div>
                        <span class="px-2 py-1 text-[10px] font-bold rounded-full border ${recColor}">
                            ${s.analyst_rec ? s.analyst_rec.toUpperCase() : 'N/A'}
                        </span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div>
                            <p class="text-[10px] text-slate-500 uppercase tracking-wider">Price</p>
                            <p class="font-mono text-white font-semibold">€${s.price.toFixed(2)}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-500 uppercase tracking-wider">P/E</p>
                            <p class="font-mono text-slate-300">${s.pe.toFixed(1)}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-500 uppercase tracking-wider">ROE</p>
                            <p class="font-mono text-slate-300">${s.roe.toFixed(1)}%</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-500 uppercase tracking-wider">RSI (14)</p>
                            <p class="font-mono font-semibold ${rsiColor}">${s.rsi.toFixed(1)}</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-slate-700/30">
                        <div>
                            <p class="text-[10px] text-slate-500 uppercase tracking-wider">Upside to Target</p>
                            <p class="font-mono font-semibold ${upsideColor}">${upside !== null ? (upside > 0 ? '+' : '') + upside + '%' : 'N/A'}</p>
                        </div>
                        <button class="px-3 py-1.5 bg-sky-500/10 text-sky-400 text-xs font-medium rounded-lg hover:bg-sky-500/20 transition-colors flex items-center gap-1">
                            <i data-lucide="bar-chart-3" class="w-3 h-3"></i> Chart
                        </button>
                    </div
                </div>`;
        }

        function renderTableRow(s) {
            const upside = s.target_mean ? (((s.target_mean - s.price) / s.price) * 100).toFixed(1) : null;
            const upsideColor = upside !== null && upside > 0 ? 'text-emerald-400' : (upside !== null ? 'text-red-400' : 'text-slate-500');
            const rsiColor = s.rsi < 30 ? 'text-emerald-400' : (s.rsi > 70 ? 'text-red-400' : 'text-slate-300');
            const recColor = s.analyst_rec?.toLowerCase().includes('buy') ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 
                             s.analyst_rec?.toLowerCase().includes('sell') ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-slate-700/30 text-slate-400 border-slate-700/50';

            return `
                <tr class="hover:bg-slate-700/20 transition-colors cursor-pointer" onclick="openChart('${s.ticker}')">
                    <td class="p-3">
                        <div class="font-bold text-white">${s.ticker.replace('.MI', '')}</div>
                    </td>
                    <td class="p-3 text-right font-mono text-white">€${s.price.toFixed(2)}</td>
                    <td class="p-3 text-right font-mono text-slate-300">${s.pe.toFixed(1)}</td>
                    <td class="p-3 text-right font-mono text-slate-300">${s.roe.toFixed(1)}%</td>
                    <td class="p-3 text-right font-mono font-semibold ${rsiColor}">${s.rsi.toFixed(1)}</td>
                    <td class="p-3 text-right font-mono text-slate-300 hidden sm:table-cell">${s.target_mean ? '€' + s.target_mean.toFixed(2) : 'N/A'}</td>
                    <td class="p-3 text-right font-mono font-semibold ${upsideColor} hidden sm:table-cell">${upside !== null ? (upside > 0 ? '+' : '') + upside + '%' : 'N/A'}</td>
                    <td class="p-3 text-center">
                        <span class="px-2 py-0.5 text-[10px] font-bold rounded-full border ${recColor}">
                            ${s.analyst_rec ? s.analyst_rec.toUpperCase() : 'N/A'}
                        </span>
                    </td>
                    <td class="p-3 text-center">
                        <button class="p-1.5 text-slate-400 hover:text-sky-400 hover:bg-sky-500/10 rounded-lg transition-colors">
                            <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                        </button>
                    </td>
                </tr>`;
        }

        // --- CHART FUNCTIONS ---
        async function openChart(ticker) {
            document.getElementById('chart-modal').classList.remove('hidden');
            document.getElementById('chart-ticker').textContent = ticker.replace('.MI', '');
            
            const container = document.getElementById('chart-container');
            container.innerHTML = ''; 
            
            try {
                const res = await fetch(`${WORKER_URL}/api/chart/${ticker}`);
                const data = await res.json();
                
                currentChart = LightweightCharts.createChart(container, {
                    width: container.clientWidth, 
                    height: 400,
                    layout: { background: { type: 'solid', color: '#020617' }, textColor: '#94a3b8' },
                    grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
                    timeScale: { timeVisible: false, borderColor: '#334155' },
                    rightPriceScale: { borderColor: '#334155' },
                });
                
                const areaSeries = currentChart.addAreaSeries({ 
                    topColor: 'rgba(14, 165, 233, 0.4)',
                    bottomColor: 'rgba(14, 165, 233, 0.0)',
                    lineColor: '#0ea5e9',
                    lineWidth: 2,
                    priceLineVisible: false
                });
                
                const formattedData = data.map(d => ({ time: d.date, value: d.close }));
                areaSeries.setData(formattedData);
                currentChart.timeScale().fitContent();
            } catch (error) {
                container.innerHTML = '<p class="p-10 text-center text-red-400">Error loading chart data.</p>';
            }
        }

        function closeChart() {
            document.getElementById('chart-modal').classList.add('hidden');
            if (currentChart) { 
                currentChart.remove(); 
                currentChart = null; 
            }
        }

        // --- FILTER SLIDER COMPONENT ---
        function FilterSlider({ id, label, min, max, step, value, display }) {
            // This is handled by the HTML template literal below for simplicity in vanilla JS
        }
    </script>
    
    <!-- Filter Slider HTML Template (Injected via JS for reusability) -->
    <script>
        document.querySelectorAll('[id^="filter-"]').forEach(el => {
            if(el.tagName === 'INPUT' && el.type === 'range') {
                const wrapper = el.parentElement;
                const label = wrapper.querySelector('label')?.textContent || el.id;
                const displayEl = document.createElement('span');
                displayEl.className = 'text-xs font-mono font-semibold text-sky-400';
                displayEl.textContent = el.value == el.getAttribute('max') && el.id !== 'filter-rsi' ? 'Any' : el.value;
                
                // Rebuild the slider UI to match bolt.new style
                wrapper.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-500">${label}</label>
                        <span class="text-xs font-mono font-semibold text-sky-400">${el.value == el.getAttribute('max') && el.id !== 'filter-rsi' ? 'Any' : el.value}</span>
                    </div>
                    <input type="range" id="${el.id}" min="${el.getAttribute('min')}" max="${el.getAttribute('max')}" step="${el.getAttribute('step')}" value="${el.value}" 
                        oninput="this.nextElementSibling.textContent = this.value == this.getAttribute('max') && this.id !== 'filter-rsi' ? 'Any' : this.value; applyFilters();"
                        class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                `;
            }
        });
    </script>
</body>
</html>
